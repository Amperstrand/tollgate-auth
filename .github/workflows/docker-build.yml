# .github/workflows/docker-build.yml — build Docker images for regression catching.
#
# Currently set to BUILD ONLY (no publish). All images are built on every
# push to verify Dockerfiles compile cleanly. To enable publishing to GHCR,
# set PUSH_TO_GHCR to "true" below and ensure the repo has packages:write
# permission. We're holding off on publishing until we decide if GHCR adds
# enough value for this project (see docs/SECURITY_AUDIT_WINDOW3.md).
#
# Topology: one sequential `build` job and one sequential `scan` job cover
# all six services (previously a 6-leg matrix per job). Sequential steps run
# in one job, so checkout/buildx setup happens once per job instead of once
# per leg, and per-job minute rounding applies to 2 jobs instead of 12.
# A failing service fails its job immediately and the failing target is
# named in the red step ("Build image: <service>" / "Run Trivy: <service>");
# later targets are skipped until the failure is fixed.

name: docker-build

on:
  push:
    branches: [main]
    paths:
      - 'docker/**'
      - 'cmd/**'
      - 'internal/**'
      - '.dockerignore'
      - '.github/workflows/docker-build.yml'
  pull_request:
    paths:
      - 'docker/**'
      - 'cmd/**'
      - 'internal/**'
      - '.dockerignore'
      - '.github/workflows/docker-build.yml'

env:
  PUSH_TO_GHCR: "false"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: env.PUSH_TO_GHCR == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "Build image: tollgate-auth-ocpi"
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/tollgate-auth-ocpi/Dockerfile
          platforms: linux/amd64
          push: false
          tags: tollgate-auth-ocpi:ci-verify
          cache-from: type=gha,scope=tollgate-auth-ocpi
          cache-to: type=gha,mode=max,scope=tollgate-auth-ocpi

      - name: "Build image: tollgate-csms"
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/tollgate-csms/Dockerfile
          platforms: linux/amd64
          push: false
          tags: tollgate-csms:ci-verify
          cache-from: type=gha,scope=tollgate-csms
          cache-to: type=gha,mode=max,scope=tollgate-csms

      - name: "Build image: tollgate-webssh"
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/tollgate-webssh/Dockerfile
          platforms: linux/amd64
          push: false
          tags: tollgate-webssh:ci-verify
          cache-from: type=gha,scope=tollgate-webssh
          cache-to: type=gha,mode=max,scope=tollgate-webssh

      - name: "Build image: tollgate-daemon"
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/tollgate-daemon/Dockerfile
          platforms: linux/amd64
          push: false
          tags: tollgate-daemon:ci-verify
          cache-from: type=gha,scope=tollgate-daemon
          cache-to: type=gha,mode=max,scope=tollgate-daemon

      - name: "Build image: tollgate-settle"
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/tollgate-settle/Dockerfile
          platforms: linux/amd64
          push: false
          tags: tollgate-settle:ci-verify
          cache-from: type=gha,scope=tollgate-settle
          cache-to: type=gha,mode=max,scope=tollgate-settle

      - name: "Build image: freeradius"
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/freeradius/Dockerfile
          platforms: linux/amd64
          push: false
          tags: freeradius:ci-verify
          cache-from: type=gha,scope=freeradius
          cache-to: type=gha,mode=max,scope=freeradius

      - name: Report status
        if: always()
        run: |
          echo "### Docker build (all targets)" >> $GITHUB_STEP_SUMMARY
          echo "Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY

  summary:
    needs: build
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Aggregate
        run: |
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "FAIL: at least one image failed to build"
            exit 1
          fi
          echo "All Docker images built successfully."

  scan:
    needs: build
    runs-on: ubuntu-latest
    if: always() && needs.build.result == 'success'
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: "Build image for scanning: tollgate-auth-ocpi"
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/tollgate-auth-ocpi/Dockerfile
          platforms: linux/amd64
          push: false
          tags: tollgate-auth-ocpi:scan
          load: true
          cache-from: type=gha,scope=tollgate-auth-ocpi

      - name: "Run Trivy: tollgate-auth-ocpi"
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: tollgate-auth-ocpi:scan
          format: table
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
          output: trivy-tollgate-auth-ocpi.txt

      - name: "Upload scan results: tollgate-auth-ocpi"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-scan-tollgate-auth-ocpi
          path: trivy-tollgate-auth-ocpi.txt

      - name: "Report: tollgate-auth-ocpi"
        if: always()
        run: |
          echo "### Trivy scan: tollgate-auth-ocpi" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "exit-code=0 means CRITICAL/HIGH findings are reported but do not fail the build." >> $GITHUB_STEP_SUMMARY
          echo "Set exit-code to 1 to enforce blocking once the baseline is clean." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat trivy-tollgate-auth-ocpi.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: "Build image for scanning: tollgate-csms"
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/tollgate-csms/Dockerfile
          platforms: linux/amd64
          push: false
          tags: tollgate-csms:scan
          load: true
          cache-from: type=gha,scope=tollgate-csms

      - name: "Run Trivy: tollgate-csms"
        uses: aquasecurity/trivy-action@master
        with:
